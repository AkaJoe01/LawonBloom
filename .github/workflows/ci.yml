name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run images:check
      - run: npm run test:coverage
      - name: prisma validate
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma validate
          else
            echo "no prisma schema yet - skipping"
          fi
      - run: npm audit --omit=dev --audit-level=high

  build-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      AUTH_URL: https://lawonbloomfertilitycentre.com
      RESEND_API_KEY: re_ci_placeholder_key
      MAIL_FROM: ci@example.com
      MAIL_TO: ci@example.com
      MAIL_ENABLED: "false"
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_placeholder_token
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-upstash-placeholder-token
      TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      SEED_ADMIN_EMAIL: ci@example.com
      SEED_ADMIN_PASSWORD: ci-admin-password-012345
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: migrate + seed
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npx tsx scripts/_m6-audit-fixtures.ts
      - run: npm run build
      - run: npm run secrets:check
      - run: npx playwright install chromium --with-deps
      - name: start server
        run: |
          npx next start -p 3123 &
          sleep 10
      - name: SEO metadata audit
        run: npx tsx scripts/seo-audit.ts
        env:
          BASE_URL: http://localhost:3123
          AUDIT_DB: required
      - name: CSP + nonce audit
        run: npx tsx scripts/csp-audit.ts
        env:
          AUDIT_PATHS: /,/blog,/blog/m6-audit-fixture,/admin/login
      - name: axe a11y audit
        run: npx tsx scripts/a11y-audit.ts
        env:
          AUDIT_PATHS: /,/blog,/blog/m6-audit-fixture,/admin/login
      # Perf smoke against the seeded blog pages; Q41's hard p75 gate runs
      # against the preview URL (plan 14b stage 15) once preview env exists.
      - name: LHCI perf smoke
        run: npx lhci autorun
        continue-on-error: true
      - name: smoke
        run: npm run smoke
        env:
          BASE_URL: http://localhost:3123
          SMOKE_POST_SLUG: m6-audit-fixture
